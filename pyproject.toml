[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-research-os"
version = "0.1.0"
description = "Approval-gated, read-only investment discussion organizer"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Investment Research OS contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["certifi>=2024.2.2"]

[project.scripts]
iros = "investment_research_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["investment_research_os*"]
